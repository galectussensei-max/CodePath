# CodePath local infrastructure.
# App database is PostgreSQL 15. Judge0 CE 1.13.1 keeps its own database and Redis.
# Service names "db" and "redis" are what judge0.conf tells the Judge0 server and workers to use.
# Judge0's isolate sandbox needs privileged containers and is supported on Linux Docker hosts.

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100m

services:
  postgres:
    image: postgres:15-alpine
    container_name: codepath-postgres
    environment:
      POSTGRES_DB: codepath
      POSTGRES_USER: codepath
      POSTGRES_PASSWORD: codepath
    ports:
      - "5433:5432"
    volumes:
      - codepath_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepath -d codepath"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    <<: *default-logging

  db:
    image: postgres:16.2
    container_name: codepath-judge0-db
    env_file: judge0.conf
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    <<: *default-logging

  redis:
    image: redis:7.2.4
    container_name: codepath-judge0-redis
    command:
      - bash
      - -c
      - 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    env_file: judge0.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    <<: *default-logging

  judge0:
    image: judge0/judge0:1.13.1
    container_name: codepath-judge0
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    <<: *default-logging

  judge0-worker:
    image: judge0/judge0:1.13.1
    container_name: codepath-judge0-worker
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    <<: *default-logging

volumes:
  codepath_postgres_data:
  judge0_postgres_data:
