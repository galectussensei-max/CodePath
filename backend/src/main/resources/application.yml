spring:
  application:
    name: codepath
  datasource:
    url: jdbc:postgresql://localhost:5433/codepath
    username: codepath
    password: codepath
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

codepath:
  jwt:
    secret: ${CODEPATH_JWT_SECRET:codepath-dev-jwt-secret-change-me-32b}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CODEPATH_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    enabled: ${CODEPATH_SEED_ENABLED:true}
  judge0:
    base-url: ${JUDGE0_BASE_URL:http://localhost:2358}
    java-language-id: 62
    java-startup-allowance-ms: 1000
    poll-interval-ms: 250
    poll-timeout-ms: 30000
    connect-timeout-ms: 3000
    read-timeout-ms: 15000
  ai:
    base-url: ${CODEPATH_AI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${CODEPATH_AI_API_KEY:}
    model: ${CODEPATH_AI_MODEL:gemini-2.0-flash}
    connect-timeout-ms: 3000
    read-timeout-ms: 30000
    max-output-tokens: 1024
    temperature: 0.3
    max-source-chars: 8000
